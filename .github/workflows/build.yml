# Jellyfin VidKing Integration — GitHub Actions CI Build
# Builds the plugin DLL + creates a GitHub Release with the installable ZIP.
# The release ZIP is what users download from the plugin repository manifest.

name: Build & Release

on:
  push:
    branches: [master]
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Jellyfin server assemblies
        run: |
          curl -fsSL https://repo.jellyfin.org/install-debian | sudo bash
          sudo apt-get update
          sudo apt-get install -y jellyfin-server

      - name: Build plugin
        run: |
          cd src
          dotnet build -c Release -o ../build

      - name: Validate Python extractor
        run: python3 -m py_compile src/VKingStreamExtractor.py

      - name: Compute version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src/meta.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create release ZIP
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p release
          cp build/Jellyfin.Plugin.VidKing.dll release/
          cp build/VKingStreamExtractor.py release/
          cp src/meta.json release/
          cp build/Jellyfin.Plugin.VidKing.deps.json release/
          cd release
          zip -q -r ../Jellyfin.Plugin.VidKing_${VERSION}.zip .
          cd ..
          echo "Created: Jellyfin.Plugin.VidKing_${VERSION}.zip"

      # Only publish to GitHub Releases on tag push (manual or CI)
      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Jellyfin.Plugin.VidKing_${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      # Upload as artifact for manual download on every build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.VidKing_${{ steps.version.outputs.version }}
          path: Jellyfin.Plugin.VidKing_${{ steps.version.outputs.version }}.zip

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile src/VKingStreamExtractor.py
      - name: Shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/build.sh monitor/install.sh
